name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # update.sh takes a full pre-deploy pg_dump first (about 11 minutes on the
    # current database); 10 minutes used to kill the job before the pull.
    timeout-minutes: 40
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          # The server's git remote is HTTPS with no credentials, so it cannot pull
          # from GitHub by itself. The runner pushes the release into the server's
          # repo over SSH (refs/heads/deploy-inbox) and update.sh fast-forwards to it.
          # Keepalives matter: update.sh is silent for the 11-minute pre-deploy dump,
          # and an idle session gets dropped, which killed the script right after
          # the dump on 2026-09-02 (dump done, nothing merged).
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          export GIT_SSH_COMMAND="ssh $SSH_OPTS"
          git push --force root@${{ secrets.DROPLET_IP }}:/opt/clutch-viewership-tracker "$GITHUB_SHA:refs/heads/deploy-inbox"
          ssh $SSH_OPTS root@${{ secrets.DROPLET_IP }} \
            'bash /opt/clutch-viewership-tracker/deploy/update.sh'
